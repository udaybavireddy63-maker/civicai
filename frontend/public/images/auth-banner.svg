<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" fill="none">
  <defs>
    <linearGradient id="authBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#137C72" />
      <stop offset="60%" stop-color="#0F665E" />
      <stop offset="100%" stop-color="#09453F" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#E6A94A" />
    </linearGradient>
    <filter id="authBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Deep Teal Background -->
  <rect width="600" height="800" fill="url(#authBgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="500" cy="150" r="160" fill="#E6A94A" opacity="0.18" filter="url(#authBlur)" />
  <circle cx="100" cy="650" r="180" fill="#24845B" opacity="0.25" filter="url(#authBlur)" />
  <circle cx="350" cy="450" r="140" fill="#3977A8" opacity="0.2" filter="url(#authBlur)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="700" x2="600" y2="700" />
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 100)">
    <!-- Brand Icon -->
    <rect width="56" height="56" rx="14" fill="#FFFFFF" opacity="0.12" />
    <rect x="2" y="2" width="52" height="52" rx="12" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" />
    <path d="M28 16L17 22V31C17 37.5 21.7 43.6 28 45.2C34.3 43.6 39 37.5 39 31V22L28 16Z" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="27" r="3.5" fill="#E6A94A" />

    <!-- Brand Tagline -->
    <text x="0" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">CivicAI</text>
    <text x="0" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#E5F4F1">Empowering communities.</text>
    <text x="0" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#FDE68A">Accelerating civic resolution.</text>

    <!-- Mission paragraph -->
    <text x="0" y="225" font-family="'Inter', sans-serif" font-size="14.5" fill="#C2D6D2" opacity="0.9">
      <tspan x="0" dy="0">Join thousands of engaged citizens reporting potholes,</tspan>
      <tspan x="0" dy="24">streetlights, waste hazards, and water leaks. Transparent,</tspan>
      <tspan x="0" dy="24">AI-assisted routing keeps city administrators informed</tspan>
      <tspan x="0" dy="24">and public spaces in peak condition.</tspan>
    </text>

    <!-- Floating Metric Cards inside graphic -->
    <!-- Card 1 -->
    <g transform="translate(0, 340)">
      <rect width="280" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" />
      <circle cx="36" cy="37" r="18" fill="#E6A94A" fill-opacity="0.2" />
      <path d="M28 37L34 43L44 31" stroke="#E6A94A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="68" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Direct Impact</text>
      <text x="68" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#E5F4F1" opacity="0.8">Real-time status updates</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(40, 435)">
      <rect width="280" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" />
      <circle cx="36" cy="37" r="18" fill="#24845B" fill-opacity="0.25" />
      <path d="M36 27V47M26 37H46" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" />
      <text x="68" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">AI-Guided Triage</text>
      <text x="68" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#E5F4F1" opacity="0.8">Instant category & priority matching</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 530)">
      <rect width="280" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" />
      <circle cx="36" cy="37" r="18" fill="#3977A8" fill-opacity="0.25" />
      <circle cx="36" cy="37" r="8" fill="#60A5FA" />
      <text x="68" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">100% Transparent</text>
      <text x="68" y="52" font-family="'Inter', sans-serif" font-size="12" fill="#E5F4F1" opacity="0.8">Full audit timeline on every report</text>
    </g>
  </g>
</svg>
